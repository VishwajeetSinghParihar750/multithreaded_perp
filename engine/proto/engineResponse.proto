message ORDER {
    Shared.ORDER_INFO info = 1;
    Shared.ORDER_ID orderId  = 2;
    Shared.USER_ID userId = 3;
    Shared.QTY filledQty = 4;
    Shared.ORDER_STATUS status = 5;
}

// const PRICE_LEVEL_SCHEMA = z.object({
//   totalQuantity: z.number(),
//   orders: z.array(ORDER_SCHEMA),
// });
// const SYMBOL_ORDERBOOK_SCHEMA = z.object({
//   BIDS: z.array(z.tuple([z.number(), PRICE_LEVEL_SCHEMA])),
//   ASKS: z.array(z.tuple([z.number(), PRICE_LEVEL_SCHEMA])),
// });

message PRICE_LEVEL {
    Shared.PRICE price = 1;
    Shared.QTY totalQty = 2;
    repeated ORDER orders = 3;
}

message ORDERBOOK {
    repeated PRICE_LEVEL bids = 1;
    repeated PRICE_LEVEL asks = 2;
}

message CURRENCY_BALANCE {
    Shared.CURRENCY_SYMBOL symbol = 1;
    Shared.QTY amount = 2;
}
