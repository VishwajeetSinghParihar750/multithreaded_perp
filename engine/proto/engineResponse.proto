message FILL {
    Shared.FILL_ID fillId = 1;
    Shared.TRADABLE_CURRENCY_SYMBOL symbol = 2;
    Shared.QTY qty = 3;
    Shared.PRICE price = 4;
    Shared.PRICE bidPrice = 5;
    Shared.FILL_ORDER_INFO sellOrderInfo = 6;
    Shared.FILL_ORDER_INFO buyOrderInfo = 6;
}

// type FILL = z.infer<typeof FILL_SCHEMA>;

// const FILLS_SCHEMA = z.array(FILL_SCHEMA);
// type FILLS = z.infer<typeof FILLS_SCHEMA>;
message FILLS {
    repeated FILL fills = 1;
}


// actual messages 

message RESPONSE_METADATA {
    Shared.REQUEST_ID requestId = 1;
}
