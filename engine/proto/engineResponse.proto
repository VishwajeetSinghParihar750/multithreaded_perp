message ORDER_CREATED {

    RESPONSE_METADATA metadata = 1;
    FILLS fills = 2;
    Shared.ORDER_Id orderId = 3;
    Shared.ORDER_STATUS status = 4;
}

// const ORDER_CANCELLED_SCHEMA = baseResponseSchema.extend({
