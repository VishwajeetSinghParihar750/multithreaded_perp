message POSITION {
    Shared.POSITION_ID positionId = 1;
    Shared.USER_ID uesrId = 2;
    Shared.PRICE price = 3;
    Shared.QTY qty = 4;
    Shared.SIDE side = 5;
    Shared.TRADABLE_CURRENCY_SYMBOL symbol = 6;
    Shared.MARGIN margin = 7;
    Shared.MARGIN_TYPE marginType = 8;
}

